# Render.com deployment config for the Go backend
# Docs: https://render.com/docs/render-yaml

services:
  - type: web
    name: crowdfunding-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free          # upgrade to starter ($7/mo) to avoid spin-down
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: GIN_MODE
        value: release
      - key: DEMO_MODE
        value: "true"   # set to "false" when KYC/bridge are wired to real providers

      # Database — injected automatically from the PostgreSQL addon below
      - key: DATABASE_URL
        fromDatabase:
          name: crowdfunding-db
          property: connectionString

      # Redis — injected automatically from the Redis addon below
      - key: REDIS_URL
        fromService:
          name: crowdfunding-redis
          type: redis
          property: connectionString

      # Secrets — set these manually in the Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WEB3AUTH_CLIENT_ID
        sync: false
      - key: WEB3AUTH_CLIENT_SECRET
        sync: false
      - key: WEB3AUTH_JWKS_ENDPOINT
        value: https://api-auth.web3auth.io/.well-known/jwks.json
      - key: ADMIN_ADDRESSES
        sync: false

      # CORS — set to your Vercel frontend URL after deployment
      # e.g.  https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

      # Blockchain (BSC Testnet)
      - key: BSC_RPC_URL
        value: https://bsc-testnet-rpc.publicnode.com
      - key: BSC_CHAIN_ID
        value: "97"
      - key: BSC_FACTORY_ADDRESS
        value: "0xf867D4B0768558B58Da7e87b73BE3b341adC2053"
      - key: BSC_IMPL_ADDRESS
        value: "0x329689BDa0286dE58E2339f8783F8400bfe435e1"
      - key: BSC_KGST_ADDRESS
        value: "0x1523a1328E35782eBe096B1d12BBd9d302f3406C"

      # Blockchain (Polygon Amoy)
      - key: POLYGON_RPC_URL
        value: https://polygon-amoy-bor-rpc.publicnode.com
      - key: POLYGON_CHAIN_ID
        value: "80002"
      - key: POLYGON_GOV_TOKEN
        value: "0x120Ab15D02C824D42EBCA19B797091865f722D87"
      - key: POLYGON_DAO
        value: "0x36F09Eb50F2Ac280cC63ac65066edd95BE541aC4"
      - key: POLYGON_REGISTRY
        value: "0x0709EE1377AE2d5B51F480768709A54F6eDA7ca0"

      # Email (optional)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

# Managed PostgreSQL database
databases:
  - name: crowdfunding-db
    databaseName: crowdfunding
    user: postgres
    plan: free

# Managed Redis instance
  - type: redis
    name: crowdfunding-redis
    plan: free
    ipAllowList: []
